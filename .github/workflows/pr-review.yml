# Claude PR review (FEAT-116)
# Runs Claude Code (anthropics/claude-code-action) on every PR. Claude follows
# .claude/agents/pr-reviewer.md and only leaves comments. Drew merges by hand.
#
# One-time setup:
#   1. Install the Claude GitHub app on this repo: https://github.com/apps/claude
#   2. On your PC run `claude setup-token` and add the token as the repo secret
#      CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions).
#      (Using an API key instead? Swap that line for anthropic_api_key.)
#
# Re-run a review: push a commit, or Actions tab > Claude PR review > Re-run.

name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # So the reviewer can run the real typecheck as evidence.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: game

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Review this pull request. Read `.claude/agents/pr-reviewer.md` first and follow it exactly.
            The PR branch is already checked out and `game/node_modules` is installed.
            If EVENT is `synchronize`, focus on what changed since your last review and do not repeat earlier comments.
            Only post GitHub comments; do not put the review in a chat message.
          claude_args: |
            --allowedTools "Read,Grep,Glob,WebFetch,WebSearch,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(npx tsc:*)"
