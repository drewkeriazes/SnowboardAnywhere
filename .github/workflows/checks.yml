# Checks in CI (FEAT-172): the checks sessions used to run by hand before pushing, on GitHub's runners.
# Every job shows as its own check on the PR. Developer guide > Checks in CI says what runs where.
#
#   typecheck-build   tsc --noEmit and vite build                                  game/ changed
#   physics-checks    the Node-only check tools (Rider physics on exact planes,     game/ changed
#                     get_pack.mjs --from; no pack, no browser)
#   browser-checks    headless check tools on the synthetic pack, SwiftShader       game/ changed
#   render-budgets    main and the PR on the synthetic pack (cishot.mjs): shader    PRs, game/ changed
#                     compile, scene budget counts (fails on a count more than 10%
#                     over main), bundle size; render-budgets-comment posts them.
#                     The before / after stills comparison only when asked for: the
#                     PR's `stills` label, or a manual run with `stills` ticked.
#                     Skipped (still green) when tools/ci/local_render_budgets.mjs
#                     passed on Drew's GPU for the same commit (FEAT-176)
#   The synthetic pack is downloaded, not built (FEAT-241): MapPacker publishes it as release synth-v<N>
#   (`publish_pack.py --synth` there). The pipeline itself lives in MapPacker (EPIC-16) and runs its own checks.
#   repo-rules        no em dashes in added Markdown, plain commit messages,         always
#                     docs-travel warning, stale main menu still warning (FEAT-177)
#   public-guards     no Spotify code, no .env files, images <= 1 MB in the right    always
#                     folders, gitleaks on the PR's commits
#
# Check tools that stay local (they need Vail / Breckenridge or a real GPU, or are too slow on software
# rendering for a runner; run them on Drew's PC and say so in the PR):
#   need a real pack: lenscheck, outruncheck, snowcheck, treefadecheck, shoot_spots, aerial, views, treeperf
#   too slow on SwiftShader (minutes per check): see BROWSER_LOCAL below
#   no pass / fail exit code (they print numbers or save shots for a person to read): leancheck, rider, shoot,
#   carveshot, brakeshot
#
# Rerun: the PR's Checks tab > Re-run jobs, or Actions > Checks > Run workflow (give the PR number to get the
# PR comment; tick stills for the before / after stills). pr-feedback.yml dispatches this workflow after it pushes, since its GITHUB_TOKEN push does
# not start a pull_request run.

name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (optional; compares against its base and comments there)
        required: false
        type: string
      stills:
        description: Compare the before / after stills too (with a PR number)
        required: false
        type: boolean
        default: false

concurrency:
  group: checks-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  BASE_REF: ${{ github.base_ref || 'main' }}
  # Node-only check tools: exit 1 on a failed check, need neither a pack nor a browser
  PHYSICS_CHECKS: accountcheck brakecheck carvecheck climbcheck conditionscheck fakiecheck fallcheck gatecheck getpackcheck hardcarvecheck mogulcheck origincheck presscheck shrubcheck standcheck treepuffcheck
  # Browser check tools that pass on the synthetic pack under SwiftShader within a few minutes
  BROWSER_CHECKS: switchcheck glancecheck hardposecheck padcheck accountmenucheck
  # BROWSER_LOCAL (timed on a runner for FEAT-172: they draw every frame, and SwiftShader takes minutes per check):
  #   powdercheck (over 7 min), menucheck (times out), leadcheck, trailcheck, statecheck (10+ min on SwiftShader), treeshot

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      game: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.game }}
      attract: ${{ steps.f.outputs.attract }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ci: &ci
              - '.github/workflows/checks.yml'
              - 'tools/ci/**'
            game:
              - *ci
              - 'game/**'
            attract:
              - 'game/src/ui/**'
              - 'game/src/world/AttractShots.ts'
              - 'game/tools/shoot_attract.mjs'

  typecheck-build:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  physics-checks:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Physics checks
        run: |
          failed=""
          for c in $PHYSICS_CHECKS; do
            echo "::group::$c"
            node tools/$c.mjs || failed="$failed $c"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi

  # The synthetic pack (FEAT-241): MapPacker's release synth-v<N>, the catalog's `test` entry at this game's
  # PACK_FORMAT, downloaded by game/tools/get_pack.mjs (sha256 checked) and cached on that sha256. Jobs that need
  # it restore it with the same key.
  synth-pack:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # one read of the catalog (CATALOG_URL in get_pack.mjs) for the key and the download, so both name the same release
      - id: key
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/catalog.json" \
            https://raw.githubusercontent.com/drewkeriazes/MapPacker-SnowboardAnywhere/main/catalog.json
          sha=$(node game/tools/get_pack.mjs synth --sha256 --catalog "$RUNNER_TEMP/catalog.json")
          echo "key=synth-sha-${sha:0:16}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: packs/synth
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: node game/tools/get_pack.mjs synth --catalog "$RUNNER_TEMP/catalog.json"

  browser-checks:
    needs: [changes, synth-pack]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: packs/synth
          key: ${{ needs.synth-pack.outputs.key }}
          fail-on-cache-miss: true
      # the pack list (packs/index.json); without it the game probes every resort and logs 404s
      - run: echo '{"packs":["synth"]}' > ../packs/index.json
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Browser checks (SwiftShader, lowgfx)
        run: |
          failed=""
          for c in $BROWSER_CHECKS; do
            echo "::group::$c"
            node tools/$c.mjs synth --cpu || failed="$failed $c"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi

  render-budgets:
    needs: [changes, synth-pack]
    if: >-
      (github.event_name == 'pull_request' || inputs.pr != '') &&
      needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # the PR's labels (`stills`)
      statuses: read # a `render-budgets/local` pass on the head commit (FEAT-176)
    outputs:
      skipped: ${{ steps.local.outputs.skip }}
      local_sha: ${{ steps.local.outputs.sha }}
    env:
      OUT: ${{ github.workspace }}/ci-stills
      MAIN: ${{ github.workspace }}/../main-src
    steps:
      - uses: actions/checkout@v6

      - name: Stills asked for?
        id: want
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=${{ inputs.stills == true && 'true' || 'false' }}
          if [ "$want" != true ] && gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx stills; then want=true; fi
          echo "stills=$want" | tee -a "$GITHUB_OUTPUT"

      # FEAT-176: skip the rest when tools/ci/local_render_budgets.mjs already passed on Drew's PC for this exact
      # commit, with the same merge base, tools and synthetic pack, and no stills asked for. The job still
      # reports success. Only the repo owner's statuses count (the repo is public).
      - name: Passed locally on this commit?
        id: local
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRUSTED: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STILLS: ${{ steps.want.outputs.stills }}
          SYNTH_KEY: ${{ needs.synth-pack.outputs.key }}
        run: |
          skip=false
          # newest first: the latest success the owner set for this context on this commit. Any API error
          # leaves a field empty, which runs the check here.
          desc=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" --jq \
            "[.[] | select(.context == \"render-budgets/local\" and .creator.login == \"$TRUSTED\" and .state == \"success\")] | first | .description // empty") || desc=""
          field() { echo "$desc" | tr ' ' '\n' | sed -n "s/^$1=//p"; }
          if [ -z "$desc" ]; then echo "no local pass from $TRUSTED on $HEAD_SHA: running here"
          elif [ "$STILLS" = true ]; then echo "stills asked for: running here"
          else
            base=$(gh api "repos/$REPO/compare/$BASE_REF...$HEAD_SHA" --jq .merge_base_commit.sha) || base=""
            tools=$(bash tools/ci/render_budgets_key.sh HEAD) || tools=""
            echo "local pass: $desc"
            echo "here:       base=$base tools=$tools synth=$SYNTH_KEY"
            if [ -z "$base" ] || [ "$(field base)" != "$base" ]; then echo "merge base moved (or unknown): running here"
            elif [ -z "$tools" ] || [ "$(field tools)" != "$tools" ]; then echo "the render-budgets tools differ: running here"
            elif [ -z "$SYNTH_KEY" ] || [ "$(field synth)" != "$SYNTH_KEY" ]; then echo "the synthetic pack differs: running here"
            else skip=true; echo "::notice::render-budgets passed locally at $HEAD_SHA: skipped in CI"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - if: steps.local.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - if: steps.local.outputs.skip != 'true'
        run: npm ci
        working-directory: game
      # render_report.py needs numpy and Pillow: the runner's own Python, in a venv (its system pip is locked)
      - if: steps.local.outputs.skip != 'true'
        name: Python for the report
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q numpy pillow
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      # main's source, built with the PR's node_modules unless the lockfile differs
      - if: steps.local.outputs.skip != 'true'
        name: Check out and build main
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add "$MAIN" FETCH_HEAD
          if cmp -s game/package-lock.json "$MAIN/game/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/game/node_modules" "$MAIN/game/node_modules"
          else
            (cd "$MAIN/game" && npm ci)
          fi
          (cd "$MAIN/game" && npx vite build)

      # one synthetic pack for both sides (FEAT-241: it comes from a release, so a PR here can't change it)
      - if: steps.local.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: packs/synth
          key: ${{ needs.synth-pack.outputs.key }}
          fail-on-cache-miss: true
      - if: steps.local.outputs.skip != 'true'
        name: Pack list
        run: echo '{"packs":["synth"]}' > packs/index.json

      - if: steps.local.outputs.skip != 'true'
        id: pw
        working-directory: game
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.local.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - if: steps.local.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: game
      - if: steps.local.outputs.skip != 'true'
        run: npx vite build
        working-directory: game

      - if: steps.local.outputs.skip != 'true'
        name: Render main (before)
        working-directory: game
        continue-on-error: true
        run: SHOT_DIST="$MAIN/game/dist" node tools/cishot.mjs synth "$OUT/before" --cpu
      - if: steps.local.outputs.skip != 'true'
        name: Render the PR (after)
        id: after
        working-directory: game
        continue-on-error: true
        run: node tools/cishot.mjs synth "$OUT/after" --cpu
      - name: Menu backdrop still (stills asked for and the menu changed)
        if: steps.local.outputs.skip != 'true' && (steps.want.outputs.stills == 'true' && needs.changes.outputs.attract == 'true')
        working-directory: game
        continue-on-error: true
        run: |
          SHOT_DIST="$MAIN/game/dist" node tools/shoot_attract.mjs synth --cpu \
            && cp public/attract/synth/*.jpg "$OUT/before/00_menu_backdrop.jpg"
          node tools/shoot_attract.mjs synth --cpu && cp public/attract/synth/*.jpg "$OUT/after/00_menu_backdrop.jpg"

      - if: steps.local.outputs.skip != 'true'
        name: Report
        id: report
        continue-on-error: true
        run: |
          python tools/ci/render_report.py "$OUT/before" "$OUT/after" "$OUT/report" \
            ${{ steps.want.outputs.stills == 'true' && '--stills' || '' }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --before-dist "$MAIN/game/dist" --after-dist game/dist
      - uses: actions/upload-artifact@v4
        if: always() && steps.local.outputs.skip != 'true'
        with:
          name: ci-stills
          path: ci-stills
          retention-days: 14
          if-no-files-found: ignore
      - if: steps.local.outputs.skip != 'true'
        name: Result
        run: |
          [ "${{ steps.after.outcome }}" = "success" ] || { echo "::error::cishot on the PR failed (shader message, page error or crash): see 'Render the PR'"; exit 1; }
          [ "${{ steps.report.outcome }}" = "success" ] || { echo "::error::scene budget over main, or no stats: see 'Report'"; exit 1; }

  # Posts (or updates) one comment on the PR with the report. Separate from `render-budgets` so the job that can
  # write to the PR runs none of the PR's code. The comment is the bot's, or the owner's when
  # tools/ci/local_render_budgets.mjs wrote it (FEAT-176); the newest one is updated.
  render-budgets-comment:
    needs: render-budgets
    if: >-
      always() && (github.event_name == 'pull_request' || inputs.pr != '') &&
      (needs.render-budgets.result == 'success' || needs.render-budgets.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LOCAL_SHA: ${{ needs.render-budgets.outputs.local_sha }}
    steps:
      # a run for a commit the PR has moved past writes nothing: it would overwrite the newer commit's report
      # (a local pass posted while this run was still going, for one)
      - name: Find the comment
        id: find
        env:
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$now" != "$RUN_SHA" ]; then echo "the PR is at $now now, this run is for $RUN_SHA: not commenting"; echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate \
            --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == "${{ github.repository_owner }}") and (.body | startswith("<!-- ci-stills -->"))) | .id' | tail -n1)
          echo "id=$id" | tee -a "$GITHUB_OUTPUT"
      - if: needs.render-budgets.outputs.skipped != 'true' && steps.find.outputs.stale != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-stills
          path: art
      - name: Comment
        if: needs.render-budgets.outputs.skipped != 'true' && steps.find.outputs.stale != 'true'
        env:
          ID: ${{ steps.find.outputs.id }}
        run: |
          body=art/report/report.md
          if [ ! -f "$body" ]; then
            printf '<!-- ci-stills -->\n## Shader compile and scene budgets (synthetic pack)\n\nThe render-budgets job failed before it wrote a report: [run log](%s).\n' \
              "$RUN_URL" > report.md
            body=report.md
          fi
          if [ -n "$ID" ] && gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F "body=@$body" > /dev/null; then :
          else gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body"; fi
      # the local run already wrote the report: add one line to it, once per commit
      - name: Note the local pass
        if: needs.render-budgets.outputs.skipped == 'true' && steps.find.outputs.stale != 'true'
        env:
          ID: ${{ steps.find.outputs.id }}
        run: |
          line="skipped in CI: passed locally at $LOCAL_SHA ([run]($RUN_URL))"
          if [ -z "$ID" ]; then
            printf '<!-- ci-stills -->\n## Shader compile and scene budgets (synthetic pack)\n\n%s\n' "$line" > body.md
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file body.md; exit 0
          fi
          gh api "repos/$REPO/issues/comments/$ID" --jq .body > body.md
          if grep -qF "passed locally at $LOCAL_SHA" body.md; then echo "already noted"; exit 0; fi
          printf '\n%s\n' "$line" >> body.md
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F "body=@body.md" > /dev/null || echo "::warning::could not add the line to comment $ID"

  repo-rules:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Repo rules
        run: |
          base=${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
          python tools/ci/repo_rules.py --base "$base" --head HEAD
      # A warning only, so it never fails the job (BUG-076): main's checks.yml runs against the PR head, and a
      # branch cut before #420 has no attract_look.mjs. A stale still only prints ::warning; any crash becomes one.
      - name: Main menu still (FEAT-177, a warning only)
        run: |
          if [ ! -f game/tools/attract_look.mjs ]; then
            echo "::notice::No game/tools/attract_look.mjs on this branch (cut before #420); merge main to run the main menu still check."
            exit 0
          fi
          base=${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
          node game/tools/attract_look.mjs --check --base "$base" || echo "::warning::attract_look.mjs --check exited $?; the main menu still check did not run."

  public-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Spotify, .env files, images
        run: |
          base=${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
          git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-list --max-parents=0 HEAD | tail -n1)
          echo "BASE=$base" >> "$GITHUB_ENV"
          python tools/ci/public_guards.py --base "$base" --head HEAD
      - name: gitleaks
        if: always()
        env:
          GITLEAKS: '8.30.1'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${GITLEAKS}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v --log-opts="$BASE..HEAD" .
