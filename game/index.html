<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowboard sim</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #fff; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.35; pointer-events: none; }
    #hud .dim { font-size: 12px; opacity: .75; }
    #hud .prompt { font-size: 16px; color: #ffe08a; }
    #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); color: #fff; font-size: 20px; }
    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #0b1020 0%, #1e3a5f 100%); z-index: 20; color: #fff; }
    #menu .panel { width: 360px; padding: 28px 32px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; backdrop-filter: blur(6px); }
    #menu .eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
    #menu h1 { margin: 4px 0 20px; font-size: 36px; }
    #menu button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
    #menu button.primary { background: #2563eb; border-color: #2563eb; }
    #menu button:hover { filter: brightness(1.15); }
    #menu .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; }
    #menu .row label { width: 70px; opacity: .85; }
    #menu .row input, #menu .row select { flex: 1; }
    #menu .keys { margin-top: 18px; font-size: 12px; opacity: .65; line-height: 1.5; }
    #prompt { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; color: #fff; text-align: center; background: rgba(20,24,34,.82); border: 2px solid #ffd166; border-radius: 14px; padding: 12px 22px; min-width: 220px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt .name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    #prompt .row { font-size: 16px; }
    #prompt .dim { opacity: .7; font-size: 13px; margin-left: 6px; }
    #prompt kbd { display: inline-block; min-width: 22px; padding: 2px 7px; margin: 0 4px; border-radius: 6px; background: #ffd166; color: #1a1a1a; font: 600 14px system-ui, sans-serif; box-shadow: 0 2px 0 #b8922e; }
    #help { position: fixed; right: 16px; top: 16px; color: #fff; font-size: 12px; opacity: .8; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status"></div>
  <div id="hud"></div>
  <div id="prompt"></div>
  <div id="help">&larr; &rarr; steer &middot; &uarr; tuck &middot; &darr; brake &middot; hold/release Space to jump &middot; Shift grab<br>E ride lift / skip to top &middot; M map (click to drop in) &middot; P piste lines &middot; N next track<br>R restart &middot; C camera &middot; F free fly (WASD + mouse)</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
