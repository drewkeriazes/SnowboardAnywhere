<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowboard sim</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #fff; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.35; pointer-events: none; }
    #hud .dim { font-size: 12px; opacity: .75; }
    #hud .prompt { font-size: 16px; color: #ffe08a; }
    #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); color: #fff; font-size: 20px; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #labels .label { position: absolute; left: 0; top: 0; color: #fff; font-size: 12px; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 8px rgba(0,0,0,.4); padding-bottom: 10px; }
    #labels .label.peak { font-weight: 600; }
    #labels .label.peak .tick { position: absolute; left: 50%; bottom: 0; width: 1px; height: 8px; background: rgba(255,255,255,.7); }
    #labels .label.peak .alt { font-weight: 400; opacity: .75; font-size: 11px; }
    #labels .label.town { font-style: italic; opacity: .9; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 10px); opacity: 0; transition: opacity .3s, transform .3s; color: #fff; font-size: 14px; background: rgba(20,24,34,.8); border-radius: 10px; padding: 8px 14px; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #touch .stick { position: absolute; left: 28px; bottom: 32px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; touch-action: none; }
    #touch .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.7); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #touch .hint { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; color: #fff; font-size: 10px; opacity: .6; white-space: nowrap; }
    #touch .btns { position: absolute; right: 24px; bottom: 32px; display: grid; grid-template-columns: 56px 56px; grid-auto-rows: 56px; gap: 10px; align-items: end; justify-items: end; }
    #touch .btns button { pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: #fff; font: 600 12px system-ui, sans-serif; width: 56px; height: 56px; }
    #touch .btns button.mid { width: 70px; height: 70px; grid-column: 1; }
    #touch .btns button.big { width: 96px; height: 96px; grid-column: 2; grid-row: span 2; background: rgba(255,209,102,.35); border-color: #ffd166; font-size: 14px; }
    #touch .btns button.down { background: rgba(255,255,255,.45); }
    @media (max-width: 700px) { #help { display: none; } #minimap { width: 140px !important; height: 140px !important; right: 12px !important; bottom: 150px !important; } #hud { font-size: 16px; } }
    #trial { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); min-width: 200px; text-align: center; color: #fff; background: rgba(20,24,34,.78); border: 2px solid #facc15; border-radius: 12px; padding: 8px 18px; display: none; pointer-events: none; font-family: system-ui, sans-serif; }
    #trial.show { display: block; }
    #trial .name { font-size: 14px; opacity: .9; }
    #trial .clock { font: 700 30px ui-monospace, monospace; }
    #trial .split { font-size: 18px; margin-top: 2px; }
    #trial .ahead { color: #4ade80; } #trial .behind { color: #f87171; } #trial .dim { opacity: .7; font-size: 13px; }
    #trial .togo { font-size: 13px; margin-top: 2px; }
    #trial .bar { height: 6px; margin: 4px 0 2px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
    #trial .bar div { height: 100%; background: #facc15; }
    #finish-arrow { position: fixed; display: none; transform: translate(-50%, -50%); pointer-events: none; text-align: center; color: #fff; font: 600 12px system-ui, sans-serif; text-shadow: 0 1px 3px #000; }
    #finish-arrow .arrow { width: 0; height: 0; margin: 0 auto 2px; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #facc15; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    #goggles, #lens { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #goggles { opacity: 0; transition: opacity .3s; }
    /* Outrun (FEAT-097): HUD at the top, the vignette under the HUD, the end card over everything */
    #outrun { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); min-width: 220px; text-align: center; color: #fff; background: rgba(20,24,34,.78); border: 2px solid #7c3aed; border-radius: 12px; padding: 8px 18px; display: none; pointer-events: none; font-family: system-ui, sans-serif; }
    #outrun.show { display: block; }
    #outrun .name { font-size: 15px; font-weight: 600; }
    #outrun .big { font: 700 30px ui-monospace, monospace; }
    #outrun .dim { opacity: .7; font-size: 13px; }
    #outrun .stats { font-size: 13px; margin-top: 2px; }
    #outrun .bar { height: 7px; margin: 5px 0 2px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    #outrun .bar div { height: 100%; background: #a78bfa; transition: width .1s linear; }
    #outrun .bar div.red { background: #ef4444; }
    #outrun .adr { height: 4px; margin: 4px 0 2px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
    #outrun .adr div { height: 100%; background: #fbbf24; }
    #outrun .boost { color: #fbbf24; font-weight: 700; font-size: 13px; letter-spacing: .1em; }
    #outrun .ready { font-size: 12px; color: #fde68a; }
    #outrun kbd { display: inline-block; padding: 1px 6px; margin: 0 3px; border-radius: 5px; background: #fbbf24; color: #1a1a1a; font: 600 12px system-ui, sans-serif; }
    #outrun-vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(ellipse at center, rgba(255,255,255,0) 45%, rgba(220,235,255,.55) 80%, rgba(255,255,255,.9) 100%); }
    #outrun-vignette.red { background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(180,0,20,.35) 75%, rgba(120,0,10,.8) 100%); }
    #outrun-card { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,12,24,.72); z-index: 21; color: #fff; }
    #outrun-card .panel { width: 340px; padding: 28px 32px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; backdrop-filter: blur(6px); text-align: center; }
    #outrun-card .title { font: 800 44px system-ui, sans-serif; letter-spacing: .08em; }
    #outrun-card .title.eaten { color: #f87171; } #outrun-card .title.escaped { color: #4ade80; }
    #outrun-card .sub { opacity: .75; margin-bottom: 14px; }
    #outrun-card .row { display: flex; justify-content: space-between; font-size: 15px; margin: 4px 0; }
    #outrun-card .row.total { border-top: 1px solid rgba(255,255,255,.2); margin-top: 8px; padding-top: 8px; font-size: 18px; }
    #outrun-card .new { color: #fbbf24; }
    #outrun-card button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
    #outrun-card button.primary { background: #7c3aed; border-color: #7c3aed; margin-top: 16px; }
    #outrun-card button.ghost { background: transparent; opacity: .8; }
    #prompt { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; color: #fff; text-align: center; background: rgba(20,24,34,.82); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 22px; min-width: 220px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt .name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    #prompt .row { font-size: 16px; }
    #prompt .dim { opacity: .7; font-size: 13px; margin-left: 6px; }
    #prompt kbd { display: inline-block; min-width: 22px; padding: 2px 7px; margin: 0 4px; border-radius: 6px; background: var(--accent); color: #1a1a1a; font: 600 14px system-ui, sans-serif; box-shadow: 0 2px 0 #b8922e; }
    /* ?cam=eye (DATA-008): only the 3D view, so screenshots match a photo */
    body.eye-mode #hud, body.eye-mode #prompt, body.eye-mode #trial, body.eye-mode #finish-arrow, body.eye-mode #help, body.eye-mode #minimap, body.eye-mode #labels, body.eye-mode #goggles, body.eye-mode #lens, body.eye-mode #outrun, body.eye-mode #outrun-vignette { display: none !important; }
    /* FEAT-137: controller glyphs, the menu focus ring, hint lines for keyboard or controller */
    .pg { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.3em; height: 1.45em; min-width: 1.45em; margin: 0 1px; }
    .pg svg { width: 1.45em; height: 1.45em; display: block; }
    .pg.pill { padding: 0 .45em; height: 1.5em; border-radius: .75em; background: rgba(20,24,34,.85); border: 1px solid rgba(255,255,255,.5); color: #fff; font: 600 .78em/1 system-ui, sans-serif; vertical-align: 0.05em; white-space: nowrap; }
    .ds-connect .hint { font-size: 11px; opacity: .65; margin: -4px 0 8px; }
    body.pad-on .kb-only { display: none !important; }
    body:not(.pad-on) .pad-only { display: none !important; }
    #help { position: fixed; right: 16px; top: 16px; color: #fff; font-size: 12px; opacity: .8; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status"></div>
  <div id="hud"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="trial"></div>
  <div id="finish-arrow"><div class="arrow"></div><div class="d"></div></div>
  <div id="help">A / D steer &middot; W tuck &middot; S brake &middot; hold Space to jump &middot; Shift squat / grab &middot; E interact &middot; hold G look behind</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
