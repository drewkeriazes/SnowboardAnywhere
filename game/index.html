<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowboard sim</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #fff; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.35; pointer-events: none; }
    #hud .dim { font-size: 12px; opacity: .75; }
    #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); color: #fff; font-size: 20px; }
    #help { position: fixed; right: 16px; top: 16px; color: #fff; font-size: 12px; opacity: .8; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status"></div>
  <div id="hud"></div>
  <div id="help">&larr; &rarr; steer &middot; &uarr; tuck &middot; &darr; brake &middot; hold/release Space to jump &middot; Shift grab<br>R restart &middot; C camera &middot; M piste map &middot; F free fly (WASD + mouse)</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
