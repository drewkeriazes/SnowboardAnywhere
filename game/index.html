<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snowboard sim</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #c { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #fff; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.6); line-height: 1.35; pointer-events: none; }
    #hud .dim { font-size: 12px; opacity: .75; }
    #hud .prompt { font-size: 16px; color: #ffe08a; }
    #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); color: #fff; font-size: 20px; }
    #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,12,24,.72); z-index: 20; color: #fff; }
    #pause .panel, #menu .panel { width: 380px; max-height: 90vh; overflow: auto; padding: 28px 32px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; backdrop-filter: blur(6px); }
    #pause .eyebrow, #menu .eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; margin-bottom: 10px; }
    #pause button, #menu button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; }
    #pause button.primary, #menu button.primary { background: #2563eb; border-color: #2563eb; }
    #pause button.ghost, #menu button.ghost { background: transparent; opacity: .8; }
    #pause button:hover, #menu button:hover { filter: brightness(1.15); }
    .settings { margin: 10px 0; padding: 10px 0 2px; border-top: 1px solid rgba(255,255,255,.15); }
    .settings.hidden, .settings .tab.hidden { display: none; }
    .settings .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .settings .tabs button { width: auto; flex: 1; margin: 0; padding: 6px 4px; font-size: 13px; opacity: .7; }
    .settings .tabs button.on { opacity: 1; background: rgba(255,255,255,.2); }
    .settings .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
    .settings .row label { width: 110px; opacity: .85; flex: none; }
    .settings .row input[type=range], .settings .row select { flex: 1; min-width: 0; }
    .settings input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: transparent; }
    .settings .row .val { width: 36px; text-align: right; opacity: .8; font-size: 12px; }
    .settings button.key { width: auto; flex: 1; margin: 0; padding: 4px 8px; font-size: 13px; font-family: ui-monospace, monospace; }
    .settings button.key.listening { background: #ffd166; color: #1a1a1a; }
    .settings .hint { font-size: 11px; opacity: .6; margin-top: 6px; }
    .settings button.ghost { margin-top: 8px; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #labels .label { position: absolute; left: 0; top: 0; color: #fff; font-size: 12px; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 8px rgba(0,0,0,.4); padding-bottom: 10px; }
    #labels .label.peak { font-weight: 600; }
    #labels .label.peak .tick { position: absolute; left: 50%; bottom: 0; width: 1px; height: 8px; background: rgba(255,255,255,.7); }
    #labels .label.peak .alt { font-weight: 400; opacity: .75; font-size: 11px; }
    #labels .label.town { font-style: italic; opacity: .9; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 10px); opacity: 0; transition: opacity .3s, transform .3s; color: #fff; font-size: 14px; background: rgba(20,24,34,.8); border-radius: 10px; padding: 8px 14px; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .settings .credits { margin-top: 8px; font-size: 12px; }
    .settings .credit { opacity: .85; margin: 2px 0; }
    .settings .credit a { color: #9cc4ff; }
    .settings .dim { opacity: .6; }
    #menu .seg { display: flex; gap: 0; margin: 6px 0 2px; }
    #menu .seg button { margin: 0; border-radius: 0; opacity: .7; }
    #menu .seg button:first-child { border-radius: 10px 0 0 10px; }
    #menu .seg button:last-child { border-radius: 0 10px 10px 0; }
    #menu .seg button.on { opacity: 1; background: rgba(255,255,255,.25); }
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #touch .stick { position: absolute; left: 28px; bottom: 32px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); pointer-events: auto; touch-action: none; }
    #touch .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.7); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #touch .hint { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; color: #fff; font-size: 10px; opacity: .6; white-space: nowrap; }
    #touch .btns { position: absolute; right: 24px; bottom: 32px; display: grid; grid-template-columns: 56px 56px; grid-auto-rows: 56px; gap: 10px; align-items: end; justify-items: end; }
    #touch .btns button { pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: #fff; font: 600 12px system-ui, sans-serif; width: 56px; height: 56px; }
    #touch .btns button.mid { width: 70px; height: 70px; grid-column: 1; }
    #touch .btns button.big { width: 96px; height: 96px; grid-column: 2; grid-row: span 2; background: rgba(255,209,102,.35); border-color: #ffd166; font-size: 14px; }
    #touch .btns button.down { background: rgba(255,255,255,.45); }
    @media (max-width: 700px) { #help { display: none; } #minimap { width: 140px !important; height: 140px !important; right: 12px !important; bottom: 150px !important; } #hud { font-size: 16px; } }
    #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
    #vignette.show { opacity: 1; }
    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #0b1020 0%, #1e3a5f 100%); z-index: 20; color: #fff; }
    #menu h1 { margin: 4px 0 20px; font-size: 36px; }
    #menu .keys { margin-top: 18px; font-size: 12px; opacity: .65; line-height: 1.5; }
    #prompt { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; color: #fff; text-align: center; background: rgba(20,24,34,.82); border: 2px solid #ffd166; border-radius: 14px; padding: 12px 22px; min-width: 220px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
    #prompt.show { opacity: 1; transform: translate(-50%, 0); }
    #prompt .name { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    #prompt .row { font-size: 16px; }
    #prompt .dim { opacity: .7; font-size: 13px; margin-left: 6px; }
    #prompt kbd { display: inline-block; min-width: 22px; padding: 2px 7px; margin: 0 4px; border-radius: 6px; background: #ffd166; color: #1a1a1a; font: 600 14px system-ui, sans-serif; box-shadow: 0 2px 0 #b8922e; }
    #help { position: fixed; right: 16px; top: 16px; color: #fff; font-size: 12px; opacity: .8; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status"></div>
  <div id="vignette"></div>
  <div id="hud"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="help">&larr; &rarr; steer &middot; &uarr; tuck &middot; &darr; brake &middot; hold/release Space to jump &middot; Shift grab<br>E ride lift / skip to top &middot; M map (click to drop in) &middot; P piste lines &middot; N next track<br>R restart &middot; C camera &middot; F free fly &middot; Esc pause / settings</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
